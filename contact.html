<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Data in DP</title>
  <meta name="description" content="Contact the Data in DP team for questions, data corrections, or partnership inquiries.">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background: #f8f9fa; color: #333; line-height: 1.7; }
    .container { max-width: 820px; margin: 40px auto; padding: 40px 20px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { color: #1a3d5c; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    a { color: #1a3d5c; text-decoration: none; font-weight: bold; }
    a:hover { text-decoration: underline; }
    .back-link { display: inline-block; margin-bottom: 20px; font-size: 0.9em; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #1a3d5c; }
    input[type="text"], input[type="email"], textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-family: inherit; box-sizing: border-box; }
    textarea { height: 150px; resize: vertical; }
    button { background: #1a3d5c; color: white; border: none; padding: 12px 20px; border-radius: 5px; font-size: 1em; cursor: pointer; font-weight: bold; }
    button:hover { background: #122c42; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← Back to Home</a>
    <h1>Contact Us</h1>
    <p>We welcome your feedback, questions, and data corrections. Whether you spotted an error in our formulas or want to suggest a new feature, please reach out using the form below or email us directly at <strong>indp1015@gmail.com</strong>.</p>

    <form action="https://formsubmit.co/indp1015@gmail.com" method="POST">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_subject" value="New Inquiry from Data in DP">
      
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required placeholder="John Doe">
      </div>
      
      <div class="form-group">
        <label for="email">Your Email Address</label>
        <input type="email" id="email" name="email" required placeholder="john@example.com">
      </div>
      
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" required placeholder="Data correction, partnership, feedback...">
      </div>
      
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="Please describe your inquiry in detail..."></textarea>
      </div>
      
      <button type="submit">Send Message</button>
    </form>

    <p style="margin-top:30px;"><a href="/">← Back to Home</a></p>
  </div>
</body>
</html>
